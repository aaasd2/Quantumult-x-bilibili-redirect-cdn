hostname = *.bilivideo.com, *.bilibili.com, *.szbdyd.com, *.akamaized.net

# 1. 精准匹配 Akamai 与各地区官方 UPOS，重定向至 mirrorcos
^https?:\/\/upos-[a-zA-Z0-9]+-[a-zA-Z0-9]+\.(?:bilivideo\.com|akamaized\.net)\/(.+) url 302 https://upos-sz-mirrorcos.bilivideo.com/$1

# 2. 拦截所有 PCDN / MCDN / 运营商边缘节点
^https?:\/\/(.+?\.)?(mcdn|szbdyd|mountaintoys|nexusedgeio)\.bilivideo\.com\/(.+) url 302 https://upos-sz-mirrorcos.bilivideo.com/$3
