##########################################################################################
# - 哔哩哔哩 cdn 强制替换为华为云 (mirrorhw)
# - 支持香港 Akamai (akamaized.net) / 官方多地区 UPOS / 各种 PCDN & MCDN
##########################################################################################

hostname = .bilivideo.com, *.bilibili.com, *.szbdyd.com, *.akamaized.net

# 0. 针对 Akamai 节点（无论有没有带 :80 端口、无论路径长短）一律重定向
^https?:\/\/upos-[a-zA-Z0-9]+-[a-zA-Z0-9]+\.akamaized\.net(?::\d+)?\/(.+) url 302 https://upos-sz-mirrorhw.bilivideo.com/$1

# 1. 匹配 bilivideo.com 下的所有 upos 节点（支持显式端口及根路径）
^https?:\/\/upos-[a-zA-Z0-9]+-[a-zA-Z0-9]+\.bilivideo\.com(?::\d+)?\/(.+) url 302 https://upos-sz-mirrorhw.bilivideo.com/$1

# 2. 拦截所有 PCDN / MCDN / 运营商节点（如 szbdyd, mcdn, 边缘节点等）
^https?:\/\/(?:[a-zA-Z0-9-]+\.)*?(?:mcdn|szbdyd|mountaintoys|nexusedgeio)\.bilivideo\.com(?::\d+)?\/(.+) url 302 https://upos-sz-mirrorhw.bilivideo.com/$1

# 3. 将已经重定向至 mirrorhw 的链接中的 os=xxx 参数统一修正为 os=hw
^https?:\/\/upos-sz-mirrorhw\.bilivideo\.com\/(.+)\?(.*)os=[a-zA-Z0-9]+(.*) url 302 https://upos-sz-mirrorhw.bilivideo.com/$1?$2os=hw$3
